name: Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  APK_NAME: Discord-Server-Manager

jobs:
  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read the app version
        id: version
        run: |
          version="$(grep '^version:' pubspec.yaml | head -1 | cut -d' ' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short=${version%%+*}" >> "$GITHUB_OUTPUT"

      - name: Install the dependencies
        run: flutter pub get

      - name: Check the format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Write the local configuration
        run: |
          cat > env.json <<'JSON'
          {
            "DISCORD_CLIENT_ID": "000000000000000000",
            "BACKEND_URL": "https://example.invalid",
            "GITHUB_REPO": "ryujin-hue/discord-server-manager"
          }
          JSON

      - name: Restore the signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || \
             [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets are set, the build uses the debug key."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Set the memory for Gradle
        run: |
          # The settings in the repository are tuned for a small machine. The
          # runner has enough memory for the dexer, which needs a lot of
          # metaspace.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Build the release package
        id: build
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            flutter build apk --release --dart-define-from-file=env.json
          else
            flutter build apk --release --dart-define-from-file=env.json \
              --build-name "${{ env.APK_NAME }}-debug-signed"
          fi

      - name: Collect the package
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "artifacts/${{ env.APK_NAME }}-${{ steps.version.outputs.short }}.apk"
          ls -l artifacts

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-Android
          path: artifacts/${{ env.APK_NAME }}-${{ steps.version.outputs.short }}.apk
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "The signing secrets are missing, no release is published."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          body="Discord Server Manager ${version}. The package is signed with the release key."
          gh release create "${GITHUB_REF_NAME}" \
            "artifacts/${{ env.APK_NAME }}-${version}.apk" \
            --title "Discord Server Manager ${version}" \
            --notes "${body}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
