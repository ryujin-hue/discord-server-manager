name: Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one run at a time, otherwise two runs would raise the version twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  APK_NAME: Discord-Server-Manager

jobs:
  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The full history holds the tags, they decide the next version.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read the app version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          else
            read -r version build tag < <(node tool/release.mjs next)
          fi
          build="$(git rev-list --count HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >&2

      - name: Write the version into the repository
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: node tool/release.mjs apply "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      - name: Install the dependencies
        run: flutter pub get

      - name: Check the format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Write the local configuration
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          client_id="${DISCORD_CLIENT_ID:-000000000000000000}"
          backend_url="${BACKEND_URL:-https://example.invalid}"
          cat > env.json <<JSON
          {
            "DISCORD_CLIENT_ID": "${client_id}",
            "BACKEND_URL": "${backend_url}",
            "GITHUB_REPO": "ryujin-hue/discord-server-manager"
          }
          JSON
          cat env.json

      - name: Restore the signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || \
             [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets are set, the build uses the debug key."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Set the memory for Gradle
        run: |
          # The settings in the repository are tuned for a small machine. The
          # runner has enough memory for the dexer, which needs a lot of
          # metaspace.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Build the release package
        id: build
        run: |
          flutter build apk --release \
            --dart-define-from-file=env.json \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build }}"

      - name: Collect the package
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "artifacts/${{ env.APK_NAME }}-${{ steps.version.outputs.version }}.apk"
          ls -l artifacts

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-Android
          path: artifacts/${{ env.APK_NAME }}-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          package="artifacts/${{ env.APK_NAME }}-${version}.apk"
          if [ "${SIGNED}" = "true" ]; then
            notes="The package is signed with the release key."
          else
            notes="The package is signed with the debug key, because no signing secret is set in the repository."
          fi
          gh release create "${tag}" "${package}" \
            --target "${{ github.sha }}" \
            --title "Discord Server Manager ${version}" \
            --notes "${notes}" \
            --generate-notes || \
          gh release upload "${tag}" "${package}" --clobber

      - name: Update the version in the repository
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "The version is already up to date."
            exit 0
          fi
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the image
        run: docker build --tag discord-server-manager-backend:test .
