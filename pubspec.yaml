name: discord_server_manager
description: >-
  Discord Server Manager: administer Discord servers and send media to
  Discord channels directly from an Android device.
publish_to: "none"
version: 1.0.2+13
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: "3.47.9"

dependencies:
  flutter:
    sdk: flutter
  crypto: "3.0.8"
  dio: "5.11.1"
  drift: "2.35.3"
  file_picker: "13.3.2"
  flutter_local_notifications: "22.3.3"
  flutter_riverpod: "3.4.3"
  flutter_secure_storage: "11.2.0"
  flutter_web_auth_2: "5.1.0"
  go_router: "18.1.2"
  http_parser: "4.1.2"
  image_picker: "1.2.4"
  intl: "0.20.3"
  path: "1.9.1"
  path_provider: "2.1.6"
  sqlite3: "3.4.0"
  url_launcher: "6.3.3"

dev_dependencies:
  build_runner: "2.17.1"
  drift_dev: "2.35.2"
  flutter_lints: "6.0.0"
  flutter_test:
    sdk: flutter
  mocktail: "1.0.5"

flutter:
  uses-material-design: true
