name = "discord-server-manager-cron"
main = "./index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cron Triggers replace the Node setInterval scheduler.
# Every 15 minutes: process due announcements.
# Twice daily: member snapshots are gated by cron_state in D1 so they only run
# once per 6h regardless of how often this fires.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "discord-server-manager"
database_id = "__D1_DATABASE_ID__"

[vars]
DISCORD_CLIENT_ID = "000000000000000000"
GATEWAY_ADVERTISE_UNAVAILABLE = "true"
# DISCORD_BOT_TOKEN and BOT_USER_ID are set via `wrangler secret put`.
